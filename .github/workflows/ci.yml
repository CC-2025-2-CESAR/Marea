name: CI

# Validação a cada pull request para a main (também disparável manualmente):
# roda a suíte reutilizável de testes (backend, frontend e Cypress). A suíte
# E2E roda sem backend — igual ao ambiente de testes, em que as chamadas à API
# são mockadas com cy.intercept.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  testes:
    name: Suíte de testes
    uses: ./.github/workflows/testes.yml
