name: Testes

# Suíte de testes reutilizável (workflow_call): backend (Django), frontend
# (lint + build) e E2E (Cypress). É chamada tanto pela CI dos pull requests
# quanto pelo workflow de deploy — assim a publicação no Azure só acontece
# depois de tudo verde, sem duplicar a definição dos testes em dois lugares.
on:
  workflow_call:

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Checagem do Django
        working-directory: backend
        run: python manage.py check

      - name: Testes do backend
        working-directory: backend
        run: python manage.py test

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Checagem de tipos (tsc)
        working-directory: frontend
        run: npm run typecheck

      - name: Build de produção
        working-directory: frontend
        run: npm run build

  e2e:
    name: Testes E2E (Cypress)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cypress (sobe o Vite e roda a suíte)
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          start: npm run dev
          wait-on: 'http://localhost:5173'
          wait-on-timeout: 120
